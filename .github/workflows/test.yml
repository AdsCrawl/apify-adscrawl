name: offline-tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest pytest-asyncio pytest-socket ruff jsonschema
      - run: pytest --disable-socket --allow-unix-socket
      - run: ruff check .
      - run: ruff format --check .
